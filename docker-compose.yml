# Servicios locales del backend.
#
# Los valores por defecto de abajo son SOLO PARA DESARROLLO LOCAL.
# Son valores publicos y jamás deben usarse en un entorno real: en produccion
# hay que inyectar los secretos reales por variable de entorno.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ajn-portfolio-backend:local
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # La imagen no trae el .slnx, asi que la base hay que apuntarla a mano.
      PORTFOLIO_DB_PATH: "Data Source=/data/portfolio.db"
      Database__AutoMigrate: "true"
      # LOCAL ONLY: sobreescribir con JWT_SECRET=<secreto real>
      Jwt__Secret: "${JWT_SECRET:-local-dev-secret-at-least-32-characters-long}"
      Jwt__Issuer: "${JWT_ISSUER:-AJNPortfolio}"
      Jwt__Audience: "${JWT_AUDIENCE:-AJNPortfolioAdmin}"
      Jwt__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-600}"
      # LOCAL ONLY: sobreescribir con BOOTSTRAP_TOKEN=<secreto real>
      Bootstrap__Token: "${BOOTSTRAP_TOKEN:-local-bootstrap-token}"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:4321}"
    volumes:
      # Volumen nombrado para persistir la base SQLite entre reinicios.
      - api-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  api-data:
