name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancela las ejecuciones anteriores del mismo branch cuando llega una nueva.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore ajn-portfolio-backend.slnx

      - name: Build
        run: dotnet build ajn-portfolio-backend.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test ajn-portfolio-backend.slnx -c Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Subir resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  docker:
    name: Imagen Docker y smoke test
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ajn-portfolio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        shell: bash
        run: |
          set -euo pipefail

          # Valores falsos, solo para CI. Nunca sirven para produccion.
          docker run -d --name ajn-ci-smoke \
            -p 8080:8080 \
            -e Jwt__Secret=ci-only-secret-not-used-in-production-000 \
            -e Jwt__Issuer=AJNPortfolio \
            -e Jwt__Audience=AJNPortfolioAdmin \
            -e Bootstrap__Token=ci-bootstrap-token \
            -e Cors__AllowedOrigins=http://localhost:4321 \
            ajn-portfolio-backend:ci

          # Esperamos hasta 60 segundos a que el contenedor quede healthy.
          healthy=0
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)"
            if [ "$code" = "200" ]; then
              healthy=1
              break
            fi
            sleep 1
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::El contenedor no quedo healthy (GET /health) dentro de los 60 segundos"
            docker logs ajn-ci-smoke || true
            exit 1
          fi

          echo "Health check OK: GET /health -> 200"

          # El contenedor tiene que haber aplicado las migraciones y servible los proyectos semilla.
          body="$(curl -sS http://localhost:8080/projects)"
          count="$(echo "$body" | jq -r '.items | length')"

          if [ "$count" != "2" ]; then
            echo "::error::Se esperaban 2 proyectos y se recibieron $count"
            echo "$body"
            exit 1
          fi

          slugs="$(echo "$body" | jq -r '[.items[].slug] | sort | join(",")')"

          if [ "$slugs" != "api-gestion,mi-portfolio" ]; then
            echo "::error::Slugs inesperados: '$slugs' (se esperaba 'api-gestion,mi-portfolio')"
            echo "$body"
            exit 1
          fi

          echo "GET /projects OK: 2 proyectos ($slugs)"

          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/projects/mi-portfolio)"
          if [ "$code" != "200" ]; then
            echo "::error::GET /projects/mi-portfolio devolvio $code"
            exit 1
          fi

          echo "GET /projects/mi-portfolio OK: 200"

      - name: Logs del contenedor
        if: always()
        run: docker logs ajn-ci-smoke || true

      - name: Limpieza
        if: always()
        run: docker rm -f ajn-ci-smoke || true
